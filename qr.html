<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjetas QR · Misión Secreta de Boda</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Great+Vibes&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #2E2A26; --gold: #B8945A; --sage: #5D6D4C; --ivory: #FBF8F3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Jost", system-ui, sans-serif; background: #ECE6DC; color: var(--ink); padding: 24px 16px 48px; }
    .toolbar { max-width: 820px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .toolbar h1 { font-family: "Cormorant Garamond", serif; font-size: 1.8rem; font-weight: 600; }
    .toolbar p { font-size: .9rem; color: #7a716a; flex-basis: 100%; }
    .toolbar code { background: #fff; padding: 2px 6px; border-radius: 6px; font-size: .85rem; word-break: break-all; }
    button { font: inherit; border: 0; cursor: pointer; background: var(--sage); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 500; }

    .sheet { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    .card {
      position: relative; background: var(--ivory); border-radius: 18px; padding: 34px 26px 28px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08); overflow: hidden;
    }
    .card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(184,148,90,.45); border-radius: 12px; pointer-events: none; }
    .eyebrow { font-size: .62rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
    .names { font-family: "Great Vibes", cursive; font-size: 2.8rem; line-height: 1; margin: 10px 0 4px; }
    .title { font-family: "Cormorant Garamond", serif; font-size: 1.45rem; font-weight: 600; line-height: 1.15; margin: 12px 0 14px; }
    .qr { width: 170px; height: 170px; margin: 0 auto; padding: 10px; background: #fff; border-radius: 10px; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .steps { list-style: none; font-size: .78rem; color: #5a524b; margin-top: 16px; display: grid; gap: 4px; }
    .tag { font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--gold); font-size: 1.1rem; margin-top: 12px; }

    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      .sheet { max-width: none; grid-template-columns: 1fr 1fr; gap: 8mm; }
      .card { box-shadow: none; border: 1px dashed #ccc; break-inside: avoid; height: 132mm; display: flex; flex-direction: column; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Tarjetas para las mesas</h1>
    <button onclick="print()">Imprimir</button>
    <p>Cuatro tarjetas por folio A4. El QR lleva a: <code id="url"></code></p>
  </div>
  <div class="sheet" id="sheet"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/shared.js?v=4"></script>
  <script>
    const cfg = window.BODA;
    const url = BodaShared.guestUrl();
    document.getElementById("url").textContent = url;
    const qr = BodaShared.qrSvg(url);
    const card = () => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <p class="eyebrow">Misión secreta</p>
        <div class="names"></div>
        <p class="title">¡Completa los retos y<br>comparte tus fotos!</p>
        <div class="qr">${qr}</div>
        <ol class="steps">
          <li>1 · Escanea el código con la cámara del móvil</li>
          <li>2 · Elige un reto y haz la foto</li>
          <li>3 · ¡Súbela y mírala en la galería!</li>
        </ol>
        <p class="tag"></p>`;
      el.querySelector(".names").textContent = `${cfg.novio1} & ${cfg.novio2}`;
      el.querySelector(".tag").textContent = cfg.hashtag || "";
      return el;
    };
    const sheet = document.getElementById("sheet");
    for (let i = 0; i < 4; i++) sheet.append(card());
  </script>
</body>
</html>
